[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "KQuant"
version = "0.1.0"
description = "Quantitative finance Python library"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]
authors = [
    {name = "Alexy Klein"}
]

[project.optional-dependencies]
test = [
    "pytest", 
    "QuantLib",   # Requis uniquement pour lancer les tests
]

